<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Change password</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 3rem auto;
      }
      label {
        display: block;
        margin: 0.75rem 0 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Change password</h1>
    <p>
      Save a login for <code>http://localhost</code> with the username <code>demo</code>, then
      change its password here. The prompt should say Update, not Save.
    </p>
    <form action="/change" method="post">
      <!-- Sites often include the account name like this so password managers can match it. -->
      <input type="hidden" name="username" autocomplete="username" value="demo" />

      <label for="cur">Current password</label>
      <input id="cur" name="current_password" type="password" autocomplete="current-password" />

      <label for="new">New password</label>
      <input id="new" name="new_password" type="password" autocomplete="new-password" />

      <label for="rep">Repeat new password</label>
      <input id="rep" name="repeat_password" type="password" autocomplete="new-password" />

      <p><button type="submit">Update password</button></p>
    </form>
  </body>
</html>
